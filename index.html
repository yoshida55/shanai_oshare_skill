<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brand</title>
    <!-- ★以下の順で読み込む -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <main>
      <!-- ヒーローセクション -->
      <section class="hero">
        <img src="img/mainvisual.jpg" class="hero_img" alt="男性が立っている姿" />
      </section>

      <header class="menu">
        <img src="img/logo.svg" class="logo1" alt="Brandのロゴ" />
        <nav class="nav">
          <ul class="nav_list">
            <li class="nav_item"><a href="#" class="nav_link">About</a></li>
            <li class="nav_item"><a href="#" class="nav_link">Work</a></li>
            <li class="nav_item"><a href="#" class="nav_link">Contact</a></li>
          </ul>
        </nav>
      </header>

      <!-- 画像とテキストの四角に分割されたセクション -->
      <section class="about">
        <div class="about_content">
          <!-- 1行目：画像 → テキスト -->
          <div class="about_img_content">
            <img src="img/mainvisual.jpg" class="hero_img_about" alt="指輪をつけた手元" />
          </div>
          <div class="about_msg_content">
            <h2 class="about_title">私たちの考えるジュエリーとは</h2>
            <p class="about_desc">Concept</p>
            <p class="about_desc2">テキストテキストテキストテキストテキストテキストテキストテキストテキスト<br />テキストテキストテキストテキストテキストテキストテキストテキストテキスト</p>
          </div>

          <!-- 2行目：テキスト → 画像（順番を逆にするだけでジグザグになる） -->
          <div class="about_msg_content">
            <h2 class="about_title">ハンドメイドにこだわる理由</h2>
            <p class="about_desc">Work</p>
            <p class="about_desc2">テキストテキストテキストテキストテキストテキストテキストテキストテキスト<br />テキストテキストテキストテキストテキストテキストテキストテキストテキスト</p>
          </div>
          <div class="about_img_content">
            <img src="img/mainvisual.jpg" class="hero_img_about" alt="花と作業机" />
          </div>
        </div>
      </section>
    </main>
    <footer class="copyright">
      <img src="img/logo.svg" class="logo" alt="Brandのロゴ" />
      <p class="copyright_text">Brand株式会社</p>
    </footer>
  </body>
</html>
